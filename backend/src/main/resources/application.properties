spring.application.name=sm-console-backend
server.port=9000

## DB
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:smconsole}?useSSL=false&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true