spring.application.name=sm-console-backend
server.port=9000

# 기본값은 local. DataInitializer/ExternalUserInitializer가 @Profile("local")로 묶여 있어서
# 이 값 그대로 두면 로컬 개발 때는 지금처럼 데이터를 따로 안 넣어도 자동으로 시드된다.
# 운영 배포 시에는 반드시 환경변수로 SPRING_PROFILES_ACTIVE=prod 등 local이 아닌 값을 넘겨서
# 덮어써야 한다 - 안 그러면 이 기본값이 그대로 적용돼 운영 DB에도 데모 관리자 계정/더미 데이터가 생긴다.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

## DB
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:smconsole}?useSSL=false&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=false
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1

# OpenAI
openai.api.key=${OPENAI_API_KEY:dummy-openai-key}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true



#slack
slack.webhook.url=${SLACK_WEBHOOK_URL:}


# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=none


incident.webhook.secret=${INCIDENT_WEBHOOK_SECRET:}


