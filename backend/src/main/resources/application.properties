spring.application.name=sm-console-backend
server.port=9000

## DB
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:smconsole}?useSSL=false&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway 설정
# 스키마는 spring.jpa.hibernate.ddl-auto=update가 관리하므로 Flyway는 명시적으로 끈다.
# (이 줄이 그냥 주석 처리만 돼 있으면 flyway-core가 classpath에 있는 한 Spring Boot 기본값(true)으로
#  꺼지지 않고 계속 켜진 채 동작한다 - 로컬 dev DB의 checksum 불일치를 겪고 나서 알게 된 함정이라
#  반드시 명시적으로 false로 써야 한다.)
spring.flyway.enabled=false
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1

# OpenAI
openai.api.key=${OPENAI_API_KEY}

# ??? ?? (?? ?? ??)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

#slack
slack.webhook.url=${SLACK_WEBHOOK_URL:}

# 인증 없이 열려있는 POST /api/incidents/webhook 호출자를 검증하는 공유 시크릿.
# 비어 있으면(미설정) 해당 엔드포인트는 모든 호출을 401로 막는다 (fail-closed).
incident.webhook.secret=${INCIDENT_WEBHOOK_SECRET:}

# Redis
spring.cache.type=none
#spring.data.redis.host=localhost
#spring.data.redis.port=6379