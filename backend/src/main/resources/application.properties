spring.application.name=sm-console-backend
server.port=9000

## DB
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/${DB_NAME:smconsole}?useSSL=false&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Flyway ???
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1

# OpenAI
openai.api.key=${OPENAI_API_KEY}

# ??? ?? (?? ?? ??)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

#slack
slack.webhook.url=${SLACK_WEBHOOK_URL:}

# 인증 없이 열려있는 POST /api/incidents/webhook을 검증하기 위한 공유 시크릿.
# 비워두면(미설정 시) 이 엔드포인트는 모든 요청을 401로 거부한다(fail-closed).
incident.webhook.secret=${INCIDENT_WEBHOOK_SECRET:}

# Redis
spring.cache.type=none
#spring.data.redis.host=localhost
#spring.data.redis.port=6379